name: Score breakout PDF

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Telegram file_id of the uploaded PDF"
        required: true
      chat_id:
        description: "Telegram chat_id to reply to"
        required: true

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scorer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_FILE_ID: ${{ inputs.file_id }}
          TG_CHAT_ID: ${{ inputs.chat_id }}
        run: python src/run.py

      - name: Commit history log (if changed)
        run: |
          git config user.name "banana-breakouts-scanner"
          git config user.email "actions@github.com"
          git add data/history.csv
          git diff --staged --quiet || git commit -m "Log run [skip ci]"
          git push
